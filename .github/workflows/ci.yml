name: RootCause AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Quality Gate & Verification (Python 3.12 + Ruff + Mypy + Pytest)
  # ---------------------------------------------------------------------------
  backend-quality-gate:
    name: Backend Quality Gate & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run linter (Ruff)
        run: uv run ruff check .

      - name: Run static type checking (Mypy)
        run: uv run mypy apps tests scripts evaluation

      - name: Run unit & integration tests (Pytest)
        run: uv run pytest -v

  # ---------------------------------------------------------------------------
  # 2. Benchmark Validation (Canonical Causal & Hallucination Evaluators)
  # ---------------------------------------------------------------------------
  benchmark-validation:
    name: Benchmark & Hallucination Evaluation
    runs-on: ubuntu-latest
    needs: [backend-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Canonical Causal Benchmark (Phase B)
        run: uv run python -m evaluation.runners.run_benchmark --verbose

      - name: Run Claim-Level Hallucination Benchmark (Phase G)
        run: uv run python -m evaluation.runners.run_hallucination_benchmark --verbose

  # ---------------------------------------------------------------------------
  # 3. Frontend Quality Gate (Node 20 + Vitest + Vite Production Build)
  # ---------------------------------------------------------------------------
  frontend-quality-gate:
    name: Frontend Quality Gate & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Verify production build (Vite + TypeScript)
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Docker Build Verification
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate, benchmark-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rootcause-ai:ci-test
